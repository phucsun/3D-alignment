[project]
name = "sgd-alignment"
version = "0.1.0"
description = "Indoor-outdoor point cloud alignment using semantic-geometric descriptors"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "open3d",
    "plyfile",
    "matplotlib",
    "pyyaml",
    "opencv-python",
]

[project.optional-dependencies]
dev = ["pytest"]
# only needed for sgd_alignment.detection.segment_2d (Grounding DINO + SAM2
# 2D door/window detection) - the rest of the package (pose/depth reading,
# backprojection, matching) has no dependency on these heavy ML libs.
segmentation = [
    "torch",
    "torchvision",
    "transformers",
    "timm",
    "accelerate",
    "ultralytics",
]

[project.scripts]
sgd-multiview-pipeline = "sgd_alignment.pipelines.multiview_pipeline:main"
sgd-align-pipeline = "sgd_alignment.pipelines.align_pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
